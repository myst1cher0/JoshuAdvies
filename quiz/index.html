<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De test – JoshuAdvies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f7f8; --surface:#fff; --ink:#12303b; --muted:#3f5963; --line:#c9dbe0; --go:#0b6e4f; --go-dark:#085740; --mark:#ffd54a; }
  * { box-sizing: border-box; }
  html { font-size: 112.5%; }
  body { margin:0; font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap { max-width:44rem; margin:0 auto; padding:0 1.25rem; }
  header { padding:1.25rem 0; border-bottom:2px solid var(--line); background:var(--surface); }
  .logo { font-size:1.4rem; font-weight:700; color:var(--ink); text-decoration:none; }
  .logo span { background:var(--mark); padding:0 .3rem; border-radius:.25rem; }
  main { padding:2rem 0 3rem; }
  .teller { color:var(--muted); margin:0 0 .5rem; }
  h1 { font-size:clamp(1.8rem,6vw,2.5rem); line-height:1.2; margin:0 0 1.5rem; }
  h1:focus { outline:none; }
  .keuzes { display:grid; gap:1rem; }
  .keuze, .btn {
    font:inherit; font-size:1.3rem; font-weight:700; text-align:left; cursor:pointer;
    background:var(--surface); color:var(--ink); border:3px solid var(--ink); border-radius:.75rem; padding:1.1rem 1.4rem;
    text-decoration:none; display:block;
  }
  .keuze:hover { background:var(--mark); }
  .btn { background:var(--go); color:#fff; border-color:var(--go-dark); text-align:center; }
  .btn:hover { background:var(--go-dark); }
  .terug { font:inherit; font-size:1.1rem; background:none; border:none; color:var(--ink); text-decoration:underline; cursor:pointer; padding:.5rem 0; margin-top:1.5rem; }
  :is(button,a,input):focus-visible { outline:4px solid var(--ink); outline-offset:4px; }
  input[type=text] { font:inherit; font-size:1.3rem; width:100%; padding:1rem 1.2rem; border:3px solid var(--ink); border-radius:.75rem; margin-bottom:1rem; }
  .hulp { color:var(--muted); margin:0 0 1rem; }
  .kader { background:var(--surface); border:2px solid var(--line); border-radius:.75rem; padding:1.25rem; margin-bottom:1.5rem; }
  .kader p { margin:0 0 .8rem; } .kader p:last-child { margin-bottom:0; }
  .samenvatting { background:var(--surface); border:3px solid var(--go); border-radius:.75rem; padding:1.4rem 1.4rem 1.6rem; margin-bottom:1.25rem; }
  .samenvatting .label { display:block; font-size:1.1rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.6rem; }
  .samenvatting p { font-size:1.45rem; line-height:1.5; margin:0; }
  .feiten { font-size:1.1rem; color:var(--muted); }
  .feiten div { display:flex; gap:.5rem; padding:.35rem 0; border-bottom:1px solid var(--line); }
  .feiten div:last-child { border-bottom:none; }
  .feiten b { min-width:9rem; color:var(--ink); }
  .fout { background:#ffecec; border-left:8px solid #c0392b; color:#7a1d14; border-radius:.5rem; padding:1rem 1.25rem; margin-bottom:1.5rem; }
  .fout:empty { display:none; }
  .stappen { background:var(--surface); border:3px solid var(--ink); border-radius:.75rem; padding:1.25rem; margin-bottom:1.5rem; }
  .stappen p { margin:0 0 .6rem; font-size:1.25rem; }
  .stappen p:last-child { margin-bottom:0; }
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="../index.html">Joshu<span>Advies</span></a></div></header>
<main><div class="wrap" id="scherm" aria-live="polite"></div></main>

<script>
/* ---------- Instellingen ---------- */
const CONFIG = {
  TELEFOON: "06 16130995",
  TELEFOON_LINK: "tel:+31616130995"
};

const PLATFORMS = {
  Windows: {
    min: 11,
    minLabel: "Windows 11",
    reden: "Vanaf 14 oktober 2025 krijgt Windows 10 geen beveiligingsupdates meer.",
    zoek: "Klik op de Start-knop > Instellingen > Systeem > Over > kijk bij Editie wat er staat, bijvoorbeeld Windows 11 Pro",
    versies: [["Windows 7 of ouder", 7], ["Windows 8", 8], ["Windows 10", 10], ["Windows 11 of nieuwer", 11]]
  },
  MacOS: {
    min: 14,
    minLabel: "macOS 14 (Sonoma) of nieuwer",
    reden: "Apple geeft alleen nog beveiligingsupdates vanaf macOS 14 (Sonoma).",
    zoek: "Klik op het Apple-menu linksboven > Over deze Mac > lees de naam en het versienummer",
    versies: [["macOS 12 of ouder", 12], ["macOS 13 (Ventura)", 13], ["macOS 14 (Sonoma)", 14], ["macOS 15 of nieuwer", 15]]
  },
  Android: {
    min: 11,
    minLabel: "Android 11 of nieuwer",
    reden: "Veel apps, waaronder de apps van banken, vragen minimaal Android 11.",
    zoek: "Open Instellingen > Over de telefoon of Over de tablet > Android-versie",
    versies: [["Android 9 of ouder", 9], ["Android 10", 10], ["Android 11", 11], ["Android 12", 12], ["Android 13 of nieuwer", 13]]
  },
  iOS: {
    min: 17,
    minLabel: "iOS 17 of nieuwer",
    reden: "De apps van banken vragen minimaal iOS 17.",
    zoek: "Open Instellingen > Algemeen > Info > Softwareversie",
    versies: [["iOS 16 of ouder", 16], ["iOS 17", 17], ["iOS 18", 18], ["iOS 26 of nieuwer", 26]]
  },
  iPadOS: {
    min: 17,
    minLabel: "iPadOS 17 of nieuwer",
    reden: "De apps van banken vragen minimaal iPadOS 17.",
    zoek: "Open Instellingen > Algemeen > Info > Softwareversie",
    versies: [["iPadOS 16 of ouder", 16], ["iPadOS 17", 17], ["iPadOS 18", 18], ["iPadOS 26 of nieuwer", 26]]
  }
};

/* ---------- Vragen ---------- */
const state = { apparaat: "", systeem: "", versie: "", versieNummer: 0, traag: "" };
const pad = [];

const stappen = {
  apparaat: {
    vraag: () => "Welk apparaat wilt u laten controleren?",
    opties: () => [["Computer (laptop of pc)", "computer"], ["Tablet", "tablet"], ["Telefoon", "telefoon"]],
    volgende: () => "systeem"
  },
  systeem: {
    vraag: () => "Welk systeem gebruikt u?",
    opties: () => ({
      computer: [["Windows", "Windows"], ["macOS (Apple)", "MacOS"]],
      tablet: [["Android", "Android"], ["iPadOS (iPad van Apple)", "iPadOS"]],
      telefoon: [["Android", "Android"], ["iOS (iPhone van Apple)", "iOS"]]
    })[state.apparaat],
    volgende: () => "versie"
  },
  versie: {
    vraag: () => "Welke versie gebruikt u?",
    hulp: () => "Weet u het niet zeker? Kies dan onderaan de knop Weet ik niet. Wij leggen stap voor stap uit waar u het vindt.",
    opties: () => {
      const p = PLATFORMS[state.systeem];
      return p.versies.map(([label, waarde]) => [label, waarde]).concat([["Weet ik niet", "weetniet"]]);
    },
    volgende: v => {
      if (v === "weetniet") return "versie-info";
      return v < PLATFORMS[state.systeem].min ? "teoud" : "traag";
    }
  },
  traag: {
    vraag: () => "Heeft u de laatste tijd last van traagheid?",
    opties: () => [["Ja", "ja"], ["Nee", "nee"]],
    volgende: v => v === "nee" ? "nietrelevant" : "bel"
  }
};

/* ---------- Hulpfuncties ---------- */
const scherm = document.getElementById("scherm");
function el(tag, cls, tekst) { const e = document.createElement(tag); if (cls) e.className = cls; if (tekst) e.textContent = tekst; return e; }
function leeg(kop, teller) {
  scherm.replaceChildren();
  if (teller) scherm.append(el("p", "teller", teller));
  const h = el("h1", "", kop); h.tabIndex = -1; scherm.append(h);
  return h;
}
function link(tekst, href, cls) { const a = el("a", cls, tekst); a.href = href; return a; }
function begin() { return link("Terug naar het begin", "../index.html", "btn"); }
function belRegel(voor) {
  const p = el("p", "", voor + " ");
  const a = link(CONFIG.TELEFOON, CONFIG.TELEFOON_LINK); a.style.fontWeight = "700"; a.style.color = "inherit";
  p.append(a); return p;
}
function terugKnop() { const t = el("button", "terug", "\u2190 Vorige vraag"); t.type = "button"; t.onclick = terug; return t; }

/* ---------- Schermen ---------- */
function toonStap(naam) {
  const s = stappen[naam];
  const h = leeg(s.vraag(), "Vraag " + (pad.length + 1));
  if (s.tekst) {
    const p = el("p", "hulp", s.hulp());
    const fout = el("div", "fout"); fout.setAttribute("role", "alert");
    const inp = el("input"); inp.type = "text"; inp.maxLength = 100;
    inp.setAttribute("aria-label", s.vraag()); inp.autocomplete = "off";
    inp.setAttribute("aria-describedby", "invoer-fout");
    fout.id = "invoer-fout";
    const ga = el("button", "btn", "Volgende"); ga.type = "button";
    const verstuur = () => {
      const w = inp.value.trim();
      if (w.length < 3) {
        fout.textContent = "Vul hier uw antwoord in.";
        inp.focus();
        return;
      }
      fout.textContent = "";
      state[naam] = w;
      ga.blur();
      gaNaar(s.volgende());
    };
    ga.onclick = verstuur;
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); verstuur(); } };
    inp.oninput = () => { fout.textContent = ""; };
    scherm.append(p, inp, fout, ga);
  } else {
    if (s.hulp) scherm.append(el("p", "hulp", s.hulp()));
    const rij = el("div", "keuzes");
    s.opties().forEach(([label, waarde]) => {
      const b = el("button", "keuze", label); b.type = "button";
      b.onclick = () => { state[naam] = waarde; gaNaar(s.volgende(waarde)); };
      rij.append(b);
    });
    scherm.append(rij);
  }
  if (pad.length) scherm.append(terugKnop());
  h.focus();
}

function toonKlaar(naam) {
  let h;
  if (naam === "nietrelevant") {
    h = leeg("U hoeft niets te doen");
    const k = el("div", "kader");
    k.append(el("p", "", "Uw apparaat is nog up-to-date en krijgt alle beveiligingsupdates. Zolang u geen last heeft van traagheid, is de rest van deze test niet nodig."));
    k.append(el("p", "", "Merkt u later toch dat het langzamer wordt? Doe de test dan gerust opnieuw."));
    scherm.append(k, begin(), terugKnop());
  } else if (naam === "bel") {
    h = leeg("Bel ons even");
    const k = el("div", "kader");
    k.append(el("p", "", "Uw software is up-to-date, dus het probleem zit waarschijnlijk niet in de versie. Wij kijken graag samen met u wat wél helpt."));
    k.append(belRegel("Bel ons op:"));
    scherm.append(k, begin(), terugKnop());
  } else if (naam === "versie-info") {
    const p = PLATFORMS[state.systeem];
    h = leeg("Zo vindt u uw versie");
    const k = el("div", "stappen");
    p.zoek.split(" > ").forEach((deel, i) => k.append(el("p", "", (i + 1) + ". " + deel)));
    const k2 = el("div", "kader");
    k2.append(el("p", "", "Lukt het niet, of vindt u het niet terug? Wij helpen u graag even telefonisch."));
    k2.append(belRegel("Bel ons op:"));
    scherm.append(k, k2, begin(), terugKnop());
  } else if (naam === "teoud") {
    const p = PLATFORMS[state.systeem];
    const label = p.versies.find(([, w]) => w === state.versie)[0];
    const android = state.systeem === "Android";
    h = leeg(android ? "Uw software is te oud" : "Wij adviseren een nieuw apparaat");
    const s = el("div", "samenvatting");
    s.append(el("span", "label", "Lees dit voor aan ons"));
    s.append(el("p", "", "Dit apparaat draait " + label + ". " + p.minLabel + " is het minimum voor moderne apps. " + (android ? "Wij kijken eerst of wij dit apparaat kunnen bijwerken." : "Wij adviseren een nieuw apparaat.")));
    const f = el("div", "kader feiten");
    [["Apparaat", state.apparaat], ["Systeem", state.systeem], ["Versie", label], ["Ons advies", android ? "Eerst kijken of een update lukt" : "Nieuw apparaat"]].forEach(([k2, v]) => {
      const rij = el("div"); rij.append(el("b", "", k2), el("span", "", String(v))); f.append(rij);
    });
    const k3 = el("div", "kader");
    k3.append(el("p", "", p.reden));
    if (android) {
      k3.append(el("p", "", "Bij veel Android-apparaten kunnen wij de software bijwerken, zodat u geen nieuw apparaat hoeft te kopen. Dat hangt af van het merk en type. Wij kijken dat voor u na."));
      k3.append(el("p", "", "Let op: bij het bijwerken wordt alles op het apparaat gewist. Bewaar dus eerst uw foto's en contacten."));
    } else {
      k3.append(el("p", "", "Wij bespreken graag met u welk nieuw apparaat bij u past."));
    }
    k3.append(belRegel("Bel ons op:"));
    scherm.append(s, f, k3, begin(), terugKnop());
  }
  if (h) h.focus();
}

/* ---------- Navigatie ---------- */
const VOLGORDE = ["apparaat", "systeem", "versie", "traag"];
function gaNaar(naam) {
  pad.push(huidige);
  huidige = naam;
  weergeef();
}
function terug() {
  huidige = pad.pop();
  const i = VOLGORDE.indexOf(huidige);
  if (i >= 0) VOLGORDE.slice(i + 1).forEach(k => { state[k] = ""; });
  state.versieNummer = 0;
  weergeef();
}
function weergeef() {
  if (stappen[huidige]) return toonStap(huidige);
  toonKlaar(huidige);
}
let huidige = "apparaat";

weergeef();
</script>
</body>
</html>

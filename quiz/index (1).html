<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De test – JoshuAdvies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f7f8; --surface:#fff; --ink:#12303b; --muted:#3f5963; --line:#c9dbe0; --go:#0b6e4f; --go-dark:#085740; --mark:#ffd54a; }
  * { box-sizing: border-box; }
  html { font-size: 112.5%; }
  body { margin:0; font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap { max-width:44rem; margin:0 auto; padding:0 1.25rem; }
  header { padding:1.25rem 0; border-bottom:2px solid var(--line); background:var(--surface); }
  .logo { font-size:1.4rem; font-weight:700; color:var(--ink); text-decoration:none; }
  .logo span { background:var(--mark); padding:0 .3rem; border-radius:.25rem; }
  main { padding:2rem 0 3rem; }
  .teller { color:var(--muted); margin:0 0 .5rem; }
  h1 { font-size:clamp(1.8rem,6vw,2.5rem); line-height:1.2; margin:0 0 1.5rem; }
  h1:focus { outline:none; }
  .keuzes { display:grid; gap:1rem; }
  .keuze, .btn {
    font:inherit; font-size:1.3rem; font-weight:700; text-align:left; cursor:pointer;
    background:var(--surface); color:var(--ink); border:3px solid var(--ink); border-radius:.75rem; padding:1.1rem 1.4rem;
    text-decoration:none; display:block;
  }
  .keuze:hover { background:var(--mark); }
  .btn { background:var(--go); color:#fff; border-color:var(--go-dark); text-align:center; }
  .btn:hover { background:var(--go-dark); }
  .terug { font:inherit; font-size:1.1rem; background:none; border:none; color:var(--ink); text-decoration:underline; cursor:pointer; padding:.5rem 0; margin-top:1.5rem; }
  :is(button,a,input):focus-visible { outline:4px solid var(--ink); outline-offset:4px; }
  input[type=text] { font:inherit; font-size:1.3rem; width:100%; padding:1rem 1.2rem; border:3px solid var(--ink); border-radius:.75rem; margin-bottom:1rem; }
  .hulp { color:var(--muted); margin:0 0 1rem; }
  .kader { background:var(--surface); border:2px solid var(--line); border-radius:.75rem; padding:1.25rem; margin-bottom:1.5rem; }
  .kader p { margin:0 0 .8rem; } .kader p:last-child { margin-bottom:0; }
  .laden { font-size:1.3rem; }
  .bol { display:inline-block; width:1rem; height:1rem; border-radius:50%; background:var(--go); margin-right:.5rem; animation:puls 1.2s infinite ease-in-out; }
  @keyframes puls { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) { .bol { animation:none; } }
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="../index.html">Joshu<span>Advies</span></a></div></header>
<main><div class="wrap" id="scherm" aria-live="polite"></div></main>

<script>
/* ---------- Instellingen ---------- */
const CONFIG = {
  // Adres van de dienst die het apparaat opzoekt (zie uitleg). Leeg = de test toont een terugbel-scherm.
  ZOEK_ENDPOINT: "",
  TELEFOON: "06 16130995",
  TELEFOON_LINK: "tel:+31616130995"
};

/* ---------- Vragen ---------- */
const state = { apparaat: "", systeem: "", traag: "", model: "" };
const pad = [];

const stappen = {
  apparaat: {
    vraag: () => "Welk apparaat wilt u laten controleren?",
    opties: () => [["Computer (laptop of pc)", "computer"], ["Tablet", "tablet"], ["Telefoon", "telefoon"]],
    volgende: () => "systeem"
  },
  systeem: {
    vraag: () => "Welk systeem gebruikt u?",
    opties: () => ({
      computer: [["Windows", "Windows"], ["MacOS (Apple)", "MacOS"]],
      tablet: [["Android", "Android"], ["iPadOS (iPad van Apple)", "iPadOS"]],
      telefoon: [["Android", "Android"], ["iOS (iPhone van Apple)", "iOS"]]
    })[state.apparaat],
    volgende: () => "traag"
  },
  traag: {
    vraag: () => "Heeft u de laatste tijd last van traagheid?",
    opties: () => [["Ja", "ja"], ["Nee", "nee"]],
    volgende: v => v === "nee" ? "nietrelevant" : state.apparaat === "telefoon" ? "bel" : "model"
  },
  model: {
    tekst: true,
    vraag: () => state.apparaat === "computer" ? "Welke computer heeft u?" : "Welke tablet heeft u?",
    hulp: () => "Typ het merk en het typenummer, bijvoorbeeld \u201CSamsung Galaxy Tab A7\u201D. Vaak staat dit op de achterkant of onderkant van het apparaat.",
    volgende: () => "zoeken"
  }
};

/* ---------- Hulpfuncties ---------- */
const scherm = document.getElementById("scherm");
function el(tag, cls, tekst) { const e = document.createElement(tag); if (cls) e.className = cls; if (tekst) e.textContent = tekst; return e; }
function leeg(kop, teller) {
  scherm.replaceChildren();
  if (teller) scherm.append(el("p", "teller", teller));
  const h = el("h1", "", kop); h.tabIndex = -1; scherm.append(h);
  return h;
}
function link(tekst, href, cls) { const a = el("a", cls, tekst); a.href = href; return a; }
function begin() { return link("Terug naar het begin", "../index.html", "btn"); }
function belRegel(voor) {
  const p = el("p", "", voor + " ");
  const a = link(CONFIG.TELEFOON, CONFIG.TELEFOON_LINK); a.style.fontWeight = "700"; a.style.color = "inherit";
  p.append(a); return p;
}

/* ---------- Schermen ---------- */
function toonStap(naam) {
  const s = stappen[naam];
  const h = leeg(s.vraag(), "Vraag " + (pad.length + 1));
  if (s.tekst) {
    const p = el("p", "hulp", s.hulp()); const inp = el("input"); inp.type = "text"; inp.maxLength = 100;
    inp.setAttribute("aria-label", s.vraag()); inp.autocomplete = "off";
    const ga = el("button", "btn", "Volgende"); ga.type = "button";
    const verstuur = () => { const w = inp.value.trim(); if (w.length < 3) { inp.focus(); return; } state.model = w; ga.blur(); gaNaar(s.volgende()); };
    ga.onclick = verstuur; inp.onkeydown = e => { if (e.key === "Enter") verstuur(); };
    scherm.append(p, inp, ga);
  } else {
    const rij = el("div", "keuzes");
    s.opties().forEach(([label, waarde]) => {
      const b = el("button", "keuze", label); b.type = "button";
      b.onclick = () => { state[naam] = waarde; gaNaar(s.volgende(waarde)); };
      rij.append(b);
    });
    scherm.append(rij);
  }
  if (pad.length) { const t = el("button", "terug", "\u2190 Vorige vraag"); t.type = "button"; t.onclick = terug; scherm.append(t); }
  h.focus();
}

function toonKlaar(naam, data) {
  let h;
  if (naam === "nietrelevant") {
    h = leeg("U hoeft niets te doen");
    const k = el("div", "kader");
    k.append(el("p", "", "Uw apparaat werkt nog prima. Zolang u geen last heeft van traagheid, is de rest van deze test niet nodig."));
    k.append(el("p", "", "Merkt u later toch dat het langzamer wordt? Doe de test dan gerust opnieuw."));
    scherm.append(k, begin());
  } else if (naam === "bel") {
    h = leeg("Bel ons even");
    const k = el("div", "kader");
    k.append(el("p", "", "Bij een telefoon kijken wij graag samen met u wat de beste oplossing is."));
    k.append(belRegel("Bel ons op:"));
    scherm.append(k, begin());
  } else if (naam === "laden") {
    h = leeg("Wij zoeken uw apparaat op");
    const p = el("p", "laden"); p.append(el("span", "bol"), document.createTextNode("Een moment geduld, dit kan een minuutje duren."));
    scherm.append(p);
  } else if (naam === "nazoek") {
    h = leeg("Bedankt voor uw antwoorden");
    const k = el("div", "kader");
    k.append(el("p", "", "Wij kijken dit voor u na. Uw gegevens: " + state.apparaat + ", " + state.systeem + ", " + state.model + "."));
    k.append(el("p", "", "Wilt u sneller antwoord? Bel ons op: " + CONFIG.TELEFOON));
    scherm.append(k, begin());
  } else if (naam === "advies") {
    h = leeg("Uw advies");
    const k = el("div", "kader");
    String(data.uitleg || "").split(/\n+/).filter(Boolean).forEach(a => k.append(el("p", "", a)));
    scherm.append(k, begin());
  }
  h.focus();
}

/* ---------- Navigatie ---------- */
function gaNaar(naam) {
  pad.push(huidige);
  huidige = naam;
  weergeef();
}
function terug() { huidige = pad.pop(); weergeef(); }
function weergeef() {
  if (huidige === "zoeken") return zoeken();
  if (stappen[huidige]) return toonStap(huidige);
  toonKlaar(huidige);
}
let huidige = "apparaat";

/* ---------- Opzoeken ---------- */
function maakPrompt() {
  const ap = { computer: "computer (laptop of pc)", tablet: "tablet", telefoon: "telefoon" }[state.apparaat];
  return "Een oudere klant heeft een " + ap + " met " + state.systeem + ", type: \u201C" + state.model + "\u201D. Het apparaat is de laatste tijd traag. " +
    "Zoek op het internet op wat dit apparaat precies is en welke software-versie het nog kan krijgen. " +
    "Beoordeel: kan er een nieuwere of andere software op geïnstalleerd worden, of is het handiger een ander apparaat te kopen? " +
    "Antwoord alleen met JSON: {\"uitkomst\":\"software\"|\"nieuw\"|\"onbekend\",\"uitleg\":\"...\"}. " +
    "Schrijf de uitleg in eenvoudig Nederlands voor iemand die niets van techniek weet, zonder vakwoorden, in maximaal 4 korte alinea's.";
}
async function zoeken() {
  toonKlaar("laden");
  if (!CONFIG.ZOEK_ENDPOINT) { setTimeout(() => toonKlaar("nazoek"), 800); return; }
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 60000);
  try {
    const r = await fetch(CONFIG.ZOEK_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
      body: JSON.stringify({ prompt: maakPrompt(), apparaat: state })
    });
    if (!r.ok) throw new Error(r.status);
    const tekst = await r.text(); let d;
    try { d = JSON.parse(tekst); } catch { d = { uitleg: tekst }; }
    toonKlaar("advies", d);
  } catch (e) { toonKlaar("nazoek"); }
  finally { clearTimeout(t); }
}

weergeef();
</script>
</body>
</html>

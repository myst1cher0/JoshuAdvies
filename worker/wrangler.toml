name = "joshuadvies-api"
main = "src/index.js"
compatibility_date = "2026-09-29"

# Vul hieronder je eigen domeinen in, gescheiden door komma's.
# Bijvoorbeeld: "https://joshuadadvies.github.io,https://joshuadvies.nl"
# Leeg laten betekent: elk domein mag het endpoint gebruiken.
[vars]
ALLOWED_ORIGINS = ""

# Opslag voor herhaalde opzoekingen is bewust NIET aangeschakeld.
# Zonder deze opslag zoekt de dienst hetzelfde apparaat vaker opnieuw.
# Bij 500 gratis zoekopdrachten per dag is dat ruim voldoende.
#
# Later aanzetten (30 seconden) als er veel verkeer komt:
#   npx wrangler kv namespace create CACHE
#   plak het id hieronder en haal de twee # tekens weg
#
# [[kv_namespaces]]
# binding = "CACHE"
# id = "PLAK_HIER_HET_KV_ID"
